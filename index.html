<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1428" />
    <!-- installable web app; these files are generated by scripts/lib/webapp.ts -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cylinder" />
    <title>Cylinder Protection</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0c1428; overflow: hidden; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* Keep the game clear of notches, rounded corners and the home indicator. */
      #game { position: fixed;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
      canvas { display: block; }
      /* Browsers can't lock orientation (iPhone home-screen apps ignore the manifest's): ask phones to turn. */
      #rotate { display: none; }
      @media (orientation: portrait) and (max-width: 600px) {
        #rotate { display: flex; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center;
          justify-content: center; gap: 18px; background: #0c1428; color: #e8f4ff; font: 600 20px Cinzel, serif;
          text-align: center; letter-spacing: 0.04em; }
        #rotate svg { width: 72px; height: 72px; animation: turn 2.4s ease-in-out infinite; }
      }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9fe7ff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2" /><path d="M10.5 18.5h3" />
      </svg>
      <div>Turn your device sideways</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
